name: Code checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.x"
      - name: Setup PNPM
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - name: Dependencies OK
        run: pnpm install --frozen-lockfile

      - name: Typecheck OK
        run: pnpm typecheck

      - name: Build OK
        run: pnpm build

      - name: Lint OK
        run: pnpm lint

      - name: Knip OK
        run: pnpm knip

      - name: Test OK
        run: pnpm test

      - name: Audit OK
        run: pnpm audit --audit-level high
        env:
          CI: true

      # Last, since it rewrites package.json and the lockfile. The floor is read from the
      # typescript range, so the two cannot drift; sheriff takes typescript as a peer and gets it too.
      - name: Test OK on the lowest supported TypeScript
        run: |
          FLOOR=$(node -p "require('./package.json').dependencies.typescript.match(/^>=(\\d+\\.\\d+)/)[1]")
          pnpm add "typescript@~$FLOOR.0"
          node -e "const v = require('typescript').version; if (!v.startsWith('$FLOOR.')) throw new Error('typescript ' + v + ' is not the floor $FLOOR')"
          pnpm test
